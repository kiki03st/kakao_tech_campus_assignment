<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 주간 뷰 추가 -->
        <div class="weekly-view">
            <button id="prev-week">&lt;</button>
            <div id="days-container"></div>
            <button id="next-week">&gt;</button>
        </div>
        
        <div class="date-nav">
            <button id="prev-date">&lt;</button>
            <h2 id="current-date-display"></h2>
            <button id="next-date">&gt;</button>
        </div>
        <h1>오늘의 할 일</h1>
        <form id="todo-form">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요">
            <button type="submit">추가</button>
        </form>
        <p id="error-message" class="hidden">할 일을 입력해주세요.</p>
        <div class="filters">
            <button id="filter-all" class="active">전체<span class="filter-cnt">0</span></button>
            <button id="filter-active">진행 중<span class="filter-cnt">0</span></button>
            <button id="filter-completed">완료<span class="filter-cnt">0</span></button>
        </div>
        <ul id="todo-list"></ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
